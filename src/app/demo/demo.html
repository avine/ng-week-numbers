<mat-form-field>
  <mat-label>Choose a date</mat-label>

  <input matInput [matDatepicker]="picker" />

  <mat-datepicker-toggle matIconSuffix [for]="picker" />

  <mat-datepicker #picker dcWeekNumbers />
</mat-form-field>

<hr style="margin-block: 2rem" />

<mat-card style="width: 300px">
  <mat-calendar [(selected)]="selectedDate" dcWeekNumbers />
</mat-card>

<p>{{ selectedDate() | date }}</p>
